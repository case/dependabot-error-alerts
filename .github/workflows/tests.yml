name: Tests

on:
  workflow_dispatch: # Adds the Web trigger
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint tools from mise.toml
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Run bin/ci
        run: bin/ci

      - name: Run the tests on the minimum supported Python
        run: mise exec python@3.12 -- python -m unittest discover -s tests -t .
