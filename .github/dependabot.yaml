version: 2

updates:
  # Go - This will intentionally fail each week, per the e2e test workflow
  - package-ecosystem: "gomod"
    directory: "/tests/fixtures/dependabot-failure"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
      time: "14:00"
      timezone: "America/Los_Angeles"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: friday
      time: "14:00"
      timezone: "America/Los_Angeles"
